name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Toolchain baseline, clean resolution & format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No pub cache: resolution must work from a clean checkout.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9

      - name: Check Flutter/Dart baseline and pubspec constraints
        run: tool/check_baseline.sh

      - name: Resolve dependencies for every package and example
        run: tool/pub_get_all.sh

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed packages examples

  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Check Flutter/Dart baseline
        run: tool/check_baseline.sh

      - name: Install dependencies (velora_lints)
        working-directory: packages/velora_lints
        run: dart pub get

      - name: Analyze velora_lints
        working-directory: packages/velora_lints
        run: dart analyze

      - name: Run velora_lints tests
        working-directory: packages/velora_lints
        run: dart test

      - name: Install dependencies (velora_cli)
        working-directory: packages/velora_cli
        run: dart pub get

      - name: Analyze velora_cli
        working-directory: packages/velora_cli
        run: dart analyze

      - name: Run velora_cli tests
        working-directory: packages/velora_cli
        run: dart test

      - name: Install dependencies (velora)
        working-directory: packages/velora
        run: flutter pub get

      - name: Analyze velora package
        working-directory: packages/velora
        run: flutter analyze --no-fatal-infos

      - name: Lint velora package
        working-directory: packages/velora
        run: dart run custom_lint --no-fatal-warnings

      - name: Run velora tests
        working-directory: packages/velora
        run: |
          if [ -d "test" ] && find test -name '*_test.dart' -print -quit | grep -q .; then
            flutter test --coverage
          else
            echo "No test files found — skipping"
          fi

      - name: Install dependencies (velora_offline)
        working-directory: packages/velora_offline
        run: flutter pub get

      - name: Analyze velora_offline package
        working-directory: packages/velora_offline
