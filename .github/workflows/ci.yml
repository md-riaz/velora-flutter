name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Toolchain baseline, clean resolution & format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No pub cache: resolution must work from a clean checkout.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9

      - name: Check Flutter/Dart baseline and pubspec constraints
        run: tool/check_baseline.sh

      - name: Resolve dependencies for every package and example
        run: tool/pub_get_all.sh

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed packages examples

      - name: Check docs match shipped code
        run: tool/check_docs.sh

  changes:
    name: Find affected packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.affected.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # A PR checks only the packages it touches and the packages that
      # depend on them. A push to main checks everything.
      - id: affected
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            packages="$(tool/affected_packages.py "origin/$BASE_REF")"
          else
            packages="$(tool/affected_packages.py --all)"
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Affected: $packages"

  check:
    name: ${{ matrix.package }}
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Check Flutter/Dart baseline
        working-directory: .
        run: tool/check_baseline.sh

      # Flutter packages use the flutter tool; pure Dart ones use dart.
      - name: Install dependencies
        run: |
          if grep -qE '^\s+sdk: flutter\s*$' pubspec.yaml; then
            flutter pub get
          else
            dart pub get
          fi

      - name: Analyze
        run: |
          if grep -qE '^\s+sdk: flutter\s*$' pubspec.yaml; then
            flutter analyze --no-fatal-infos
          else
            dart analyze
          fi

      # velora_lints defines the rules; every other package that lists
      # custom_lint runs them.
      - name: Lint (custom_lint)
        if: matrix.package != 'packages/velora_lints'
        run: |
          if grep -qE '^\s+custom_lint:' pubspec.yaml; then
            dart run custom_lint --no-fatal-warnings
          else
            echo "custom_lint not configured — skipping"
          fi

      - name: Test
        run: |
          if [ ! -d test ] || ! find test -name '*_test.dart' -print -quit | grep -q .; then
            echo "No test files found — skipping"
          elif grep -qE '^\s+sdk: flutter\s*$' pubspec.yaml; then
            flutter test
          else
            dart test
          fi

  # One stable check name for branch protection, whatever the matrix ran.
  analyze:
    name: Analyze & Test
    needs: [changes, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every package check to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECK: ${{ needs.check.result }}
        run: |
          echo "changes=$CHANGES check=$CHECK"
          [ "$CHANGES" = "success" ] || exit 1
          # "skipped" means no package was affected.
          [ "$CHECK" = "success" ] || [ "$CHECK" = "skipped" ] || exit 1
