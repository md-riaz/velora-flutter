name: Deploy Docs

on:
  # Run after the build workflow finishes so the demo/gallery web artifacts
  # exist and can be pulled from that exact build run (same commit), rather
  # than racing an independent build and grabbing the latest-available one.
  workflow_run:
    workflows: ["Build Example Apps"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest
    # Deploy only when the triggering build succeeded (so every artifact is
    # present and from the same commit), or on a manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the docs from the exact commit that was built; a
          # workflow_run job otherwise checks out the default-branch tip.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Install MkDocs toolchain
        run: pip install "mkdocs==1.6.1" "mkdocs-material==9.5.49"

      - name: Build docs site
        run: mkdocs build

      - name: Install dependencies
        working-directory: packages/velora
        run: flutter pub get

      - name: Generate API docs
        working-directory: packages/velora
        run: dart doc --output=../../_site/api

      # The landing page advertises all four demos as live links, so a missing
      # artifact must fail the deploy rather than publish a 404ing link. Each
      # download is fail-hard (`if_no_artifact_found: fail`, no
      # `continue-on-error`); on the normal path the triggering build succeeded
      # and produced every artifact, so this only trips on a genuine anomaly.
      - name: Download web demo artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          name: claude-clone-web
          path: _site/demo
          # From the exact build run on workflow_run; falls back to the latest
          # successful build for a manual dispatch (empty run_id).
          run_id: ${{ github.event.workflow_run.id }}
          search_artifacts: true
          if_no_artifact_found: fail

      - name: Fix demo base href for Pages
        run: sed -i 's|<base href="/claude_clone/">|<base href="/velora-flutter/demo/">|' _site/demo/index.html

      - name: Download gallery web artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          name: velora-ui-gallery-web
          path: _site/gallery
          run_id: ${{ github.event.workflow_run.id }}
          search_artifacts: true
          if_no_artifact_found: fail

      - name: Fix gallery base href for Pages
        run: sed -i 's|<base href="/velora-ui-gallery/">|<base href="/velora-flutter/gallery/">|' _site/gallery/index.html

      - name: Download chat web artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          name: velora-chat-web
          path: _site/chat
          run_id: ${{ github.event.workflow_run.id }}
          search_artifacts: true
          if_no_artifact_found: fail

      - name: Fix chat base href for Pages
        run: sed -i 's|<base href="/velora-chat/">|<base href="/velora-flutter/chat/">|' _site/chat/index.html

      - name: Download catalog web artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          name: velora-catalog-web
          path: _site/catalog
          run_id: ${{ github.event.workflow_run.id }}
          search_artifacts: true
          if_no_artifact_found: fail

      - name: Fix catalog base href for Pages
        run: sed -i 's|<base href="/velora-catalog/">|<base href="/velora-flutter/catalog/">|' _site/catalog/index.html

      - name: Copy landing page
        run: cp docs/index.html _site/index.html

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
