name: Build Example Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        working-directory: examples/claude_clone
        run: flutter pub get

      - name: Build APK
        working-directory: examples/claude_clone
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: claude-clone-apk
          path: examples/claude_clone/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        working-directory: examples/claude_clone
        run: flutter pub get

      - name: Build web
        working-directory: examples/claude_clone
        run: flutter build web --release --base-href /claude_clone/

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: claude-clone-web
          path: examples/claude_clone/build/web
          retention-days: 30

  build-gallery-web:
    name: Build Gallery Web App
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      # velora_ui_gallery is a lib-only example (no platform folders checked
      # in), so generate the web platform files before building.
      - name: Generate web platform files
        working-directory: examples/velora_ui_gallery
        run: flutter create --platforms=web .

      - name: Install dependencies
        working-directory: examples/velora_ui_gallery
        run: flutter pub get

      - name: Build web
        working-directory: examples/velora_ui_gallery
        run: flutter build web --release --base-href /velora-ui-gallery/

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: velora-ui-gallery-web
          path: examples/velora_ui_gallery/build/web
          retention-days: 30

  build-chat-web:
    name: Build Chat Web App
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        working-directory: examples/velora_chat
        run: flutter pub get

      # velora_db's web executor (drift WasmDatabase) fetches sqlite3.wasm and
      # drift_worker.dart.js at runtime, so they must sit next to the app or the
      # deployed demo 404s them and fails to boot. Copy both from the resolved
      # drift package (its bundled sqlite3.wasm is byte-identical to drift's
      # release asset, and drift_worker.js is the prebuilt compiled worker) so
      # the build is offline and version-locked — no drift_dev/codegen needed.
      - name: Bundle drift web assets
        working-directory: examples/velora_chat
        run: |
          DRIFT_ROOT=$(python3 -c "import json; c=json.load(open('.dart_tool/package_config.json')); u=next(p['rootUri'] for p in c['packages'] if p['name']=='drift'); print(u[7:] if u.startswith('file://') else u)")
          cp "$DRIFT_ROOT/extension/devtools/build/sqlite3.wasm" web/sqlite3.wasm
          cp "$DRIFT_ROOT/drift_worker.js" web/drift_worker.dart.js

      - name: Build web
        working-directory: examples/velora_chat
        run: flutter build web --release --base-href /velora-chat/

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: velora-chat-web
          path: examples/velora_chat/build/web
          retention-days: 30

  build-catalog-web:
    name: Build Catalog Web App
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        working-directory: examples/velora_catalog
        run: flutter pub get

      # See the chat job: velora_db's web executor needs sqlite3.wasm and
      # drift_worker.dart.js served alongside the app, copied from the resolved
      # drift package so the build stays offline and version-locked.
      - name: Bundle drift web assets
        working-directory: examples/velora_catalog
        run: |
          DRIFT_ROOT=$(python3 -c "import json; c=json.load(open('.dart_tool/package_config.json')); u=next(p['rootUri'] for p in c['packages'] if p['name']=='drift'); print(u[7:] if u.startswith('file://') else u)")
          cp "$DRIFT_ROOT/extension/devtools/build/sqlite3.wasm" web/sqlite3.wasm
          cp "$DRIFT_ROOT/drift_worker.js" web/drift_worker.dart.js

      - name: Build web
        working-directory: examples/velora_catalog
        run: flutter build web --release --base-href /velora-catalog/

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: velora-catalog-web
          path: examples/velora_catalog/build/web
          retention-days: 30

  release:
    name: Create Release
    if: github.event_name == 'workflow_dispatch'
    needs: [build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' packages/velora/pubspec.yaml | awk '{print $2}' | tr -d '\r')
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if tag exists
        if: steps.tag_check.outputs.exists == 'true'
        run: |
          echo "Tag ${{ steps.version.outputs.tag }} already exists — skipping release."
          exit 0

      - name: Download APK
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: claude-clone-apk
          path: artifacts

      - name: Rename APK
        if: steps.tag_check.outputs.exists == 'false'
        run: mv artifacts/app-release.apk artifacts/claude-clone.apk

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: artifacts/claude-clone.apk
