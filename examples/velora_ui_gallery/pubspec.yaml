name: velora_ui_gallery
description: A ThemePreset showcase for native Material and retained velora_ui components.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  velora_ui:
    path: ../../packages/velora_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  custom_lint: ^0.6.0
  velora_lints:
    path: ../../packages/velora_lints

flutter:
  uses-material-design: true
