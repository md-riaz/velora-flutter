name: velora_ui_gallery
description: A gallery/showcase app for the velora_ui design system — every component in light/dark and both theme presets.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  velora_ui:
    path: ../../packages/velora_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
