name: velora_ui
description: "Token-first design system for Velora apps: a VeloraTokens ThemeExtension plus original Velora theme presets (Layer 1 — components come in a later layer)."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.1
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Velora's brand faces (both SIL OFL 1.1 — licenses in assets/fonts/).
  # Space Grotesk carries the distinctive display voice; Inter is the
  # workhorse for body/label legibility. Both are variable fonts, so a
  # single asset covers every weight the type scale asks for.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
